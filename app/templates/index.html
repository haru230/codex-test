<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Todo List</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        max-width: 720px;
        margin: 2rem auto;
        padding: 0 1rem;
      }
      form.inline {
        display: inline;
      }
      ul {
        list-style: none;
        padding-left: 0;
      }
      li {
        display: flex;
        justify-content: space-between;
        align-items: center;
        border: 1px solid #ddd;
        border-radius: 8px;
        padding: 0.75rem;
        margin-bottom: 0.75rem;
      }
      .completed {
        text-decoration: line-through;
        color: #6b7280;
      }
      .actions {
        display: flex;
        gap: 0.5rem;
      }
      button {
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <h1>Todo List</h1>

    <form action="/todos" method="post">
      <input type="text" name="title" placeholder="Add a todo" required />
      <button type="submit">Add</button>
    </form>

    <ul>
      {% for todo in todos %}
      <li>
        <span class="{% if todo.completed %}completed{% endif %}">{{ todo.title }}</span>
        <div class="actions">
          <form class="inline" action="/todos/{{ todo.id }}/toggle" method="post">
            <button type="submit">{% if todo.completed %}Undo{% else %}Done{% endif %}</button>
          </form>
          <form class="inline" action="/todos/{{ todo.id }}/delete" method="post">
            <button type="submit">Delete</button>
          </form>
        </div>
      </li>
      {% else %}
      <li>No todos yet.</li>
      {% endfor %}
    </ul>
  </body>
</html>
